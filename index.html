<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingo Trail — Language Learning App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#2E1B3D;
    --purple-mid:#4A2E63;
    --purple-light:#7A5590;
    --brown:#B98457;
    --brown-dark:#8A5E38;
    --brown-pale:#F1E3D3;
    --cream:#FAF3E8;
    --ink:#2A1D33;
    --success:#7DAD8B;
    --error:#C46B5E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 10%, rgba(185,132,87,0.10), transparent 42%),
      radial-gradient(circle at 90% 88%, rgba(122,85,144,0.18), transparent 45%),
      var(--purple-deep);
    font-family:'Nunito Sans', sans-serif;
    color:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
  }

  h1{
    font-family:'DM Serif Display', serif;
    font-weight:400;
    font-size:38px;
    margin:0 0 4px;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  .sub{
    font-size:14px;
    color:var(--brown);
    margin:0 0 32px;
    text-align:center;
    font-weight:600;
    letter-spacing:0.02em;
  }

  .wrap{ width:min(94vw, 780px); }
  .hidden{ display:none !important; }

  /* ---------- Language picker ---------- */
  .lang-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(126px, 1fr));
    gap:14px;
  }
  .lang-card{
    background:var(--purple-mid);
    border:1.5px solid rgba(250,243,232,0.08);
    border-radius:16px;
    padding:20px 12px;
    text-align:center;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .lang-card:hover{ background:#5A3877; transform:translateY(-2px); border-color:var(--brown); }
  .lang-flag{ font-size:32px; margin-bottom:8px; }
  .lang-name{ font-weight:700; font-size:14.5px; }
  .lang-native{ font-size:11px; color:var(--brown); margin-top:2px; }

  /* ---------- Motivation / onboarding screen ---------- */
  .motivation-card{
    background:var(--cream);
    color:var(--ink);
    border-radius:22px;
    padding:38px 30px;
    text-align:center;
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.45);
  }
  .motivation-flag{ font-size:44px; margin-bottom:10px; }
  .motivation-title{
    font-family:'DM Serif Display', serif;
    font-size:26px;
    color:var(--purple-deep);
    margin:0 0 6px;
  }
  .motivation-sub{
    font-size:13.5px;
    color:var(--brown-dark);
    margin:0 0 26px;
  }
  .motivation-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .motivation-opt{
    background:var(--brown-pale);
    border:2px solid transparent;
    border-radius:14px;
    padding:16px 12px;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .motivation-opt span.emoji{ font-size:22px; }
  .motivation-opt:hover{ border-color:var(--purple-mid); background:#EAD9C0; }

  .motivation-response{
    margin-top:24px;
    display:none;
  }
  .motivation-response.show{ display:block; }
  .motivation-response p{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.5;
    margin:0 0 20px;
  }
  .start-btn{
    background:var(--purple-deep);
    color:var(--cream);
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .start-btn:hover{ background:var(--purple-mid); }

  .back-link{
    display:block;
    text-align:center;
    margin-top:16px;
    font-size:12.5px;
    color:rgba(250,243,232,0.55);
    cursor:pointer;
    text-decoration:underline;
  }

  /* ---------- Course view ---------- */
  .course-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:12px;
  }
  .back-btn{
    background:none;
    border:1.5px solid var(--brown);
    color:var(--brown);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .back-btn:hover{ background:rgba(185,132,87,0.15); }

  .progress-pill{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--brown-pale);
  }
  .progress-track{
    width:110px;
    height:6px;
    background:rgba(250,243,232,0.12);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--brown);
    border-radius:4px;
    transition:width 0.3s ease;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--purple-mid);
    border:1.5px solid transparent;
    color:var(--brown-pale);
    padding:9px 18px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .tab-btn.active{ background:var(--brown); color:var(--purple-deep); }
  .tab-btn:not(.active):hover{ border-color:var(--brown); }

  /* ---------- Flashcard lesson ---------- */
  .lesson-card{
    background:var(--cream);
    color:var(--ink);
    border-radius:20px;
    padding:36px 30px;
    text-align:center;
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.45);
    min-height:220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    position:relative;
  }
  .lesson-category{
    position:absolute;
    top:16px; left:20px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--brown-dark);
  }
  .lesson-word{
    font-family:'DM Serif Display', serif;
    font-size:32px;
    color:var(--purple-deep);
  }
  .lesson-pron{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--brown-dark);
  }
  .lesson-translation{
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin-top:6px;
  }
  .speak-btn{
    margin-top:10px;
    width:42px; height:42px;
    border-radius:50%;
    background:var(--purple-mid);
    color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    border:none;
    cursor:pointer;
  }
  .speak-btn:hover{ background:var(--purple-light); }

  .lesson-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:20px;
  }
  .nav-btn{
    width:44px; height:44px;
    border-radius:50%;
    background:var(--purple-mid);
    color:var(--cream);
    border:1.5px solid rgba(250,243,232,0.1);
    font-size:16px;
    cursor:pointer;
  }
  .nav-btn:hover:not(:disabled){ background:var(--purple-light); }
  .nav-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .lesson-count{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--brown-pale);
  }

  /* ---------- Grammar tips ---------- */
  .grammar-list{ display:flex; flex-direction:column; gap:12px; }
  .grammar-item{
    background:var(--purple-mid);
    border-radius:14px;
    padding:16px 18px;
    border-left:3px solid var(--brown);
  }
  .grammar-title{ font-weight:800; font-size:14.5px; margin-bottom:4px; color:var(--cream); }
  .grammar-text{ font-size:13.5px; color:var(--brown-pale); line-height:1.5; }

  /* ---------- Quiz ---------- */
  .quiz-card{
    background:var(--cream);
    color:var(--ink);
    border-radius:20px;
    padding:30px 26px;
    box-shadow:0 20px 44px -18px rgba(0,0,0,0.45);
  }
  .quiz-question{
    font-family:'DM Serif Display', serif;
    font-size:22px;
    text-align:center;
    margin-bottom:22px;
    color:var(--purple-deep);
  }
  .quiz-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .quiz-opt{
    background:var(--brown-pale);
    border:2px solid transparent;
    border-radius:12px;
    padding:14px 12px;
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
  }
  .quiz-opt:hover{ border-color:var(--brown); }
  .quiz-opt.correct{ background:var(--success); color:#fff; }
  .quiz-opt.wrong{ background:var(--error); color:#fff; }

  .quiz-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .quiz-score{
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--purple-mid);
  }
  .next-quiz-btn{
    background:var(--purple-deep);
    color:var(--cream);
    border:none;
    padding:10px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease;
  }
  .next-quiz-btn.show{ opacity:1; pointer-events:auto; }
  .next-quiz-btn:hover{ background:var(--purple-mid); }

  .quiz-done{
    text-align:center;
    padding:20px 0;
  }
  .quiz-done h3{
    font-family:'DM Serif Display', serif;
    font-size:26px;
    color:var(--purple-deep);
    margin:0 0 8px;
  }
  .quiz-done p{ color:var(--brown-dark); font-size:14px; }
  .retry-btn{
    margin-top:14px;
    background:var(--purple-deep);
    color:var(--cream);
    border:none;
    padding:10px 22px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
  }

  footer{
    margin-top:36px;
    font-size:11px;
    color:rgba(250,243,232,0.3);
    text-align:center;
  }

  @media (max-width:480px){
    .lesson-word{ font-size:26px; }
    .quiz-options{ grid-template-columns:1fr; }
    .motivation-options{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <h1>Lingo Trail</h1>
  <p class="sub">Pick a language, follow the trail, learn a little every day</p>

  <div class="wrap">

    <!-- STEP 1: LANGUAGE PICKER -->
    <div id="pickerView">
      <div class="lang-grid" id="langGrid"></div>
    </div>

    <!-- STEP 2: MOTIVATION / ONBOARDING -->
    <div id="motivationView" class="hidden">
      <div class="motivation-card">
        <div class="motivation-flag" id="motFlag">🌍</div>
        <h2 class="motivation-title" id="motTitle">Why do you want to learn this?</h2>
        <p class="motivation-sub">Pick what fits best — it just helps set the mood!</p>
        <div class="motivation-options" id="motOptions"></div>
        <div class="motivation-response" id="motResponse">
          <p id="motResponseText"></p>
          <button class="start-btn" id="startLearningBtn">Start Learning →</button>
        </div>
      </div>
      <span class="back-link" id="motBackLink">← Choose a different language</span>
    </div>

    <!-- STEP 3: COURSE VIEW -->
    <div id="courseView" class="hidden">
      <div class="course-header">
        <button class="back-btn" id="backBtn">← Change Language</button>
        <div class="progress-pill">
          <span id="progressLabel">0%</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="vocabulary">Vocabulary</button>
        <button class="tab-btn" data-tab="phrases">Phrases</button>
        <button class="tab-btn" data-tab="grammar">Grammar</button>
        <button class="tab-btn" data-tab="quiz">Quiz</button>
      </div>

      <div id="lessonPane">
        <div class="lesson-card">
          <span class="lesson-category" id="lessonCategory">VOCABULARY</span>
          <div class="lesson-word" id="lessonWord">&mdash;</div>
          <div class="lesson-pron" id="lessonPron">&mdash;</div>
          <div class="lesson-translation" id="lessonTranslation">&mdash;</div>
          <button class="speak-btn" id="speakBtn" title="Hear pronunciation">&#128266;</button>
        </div>
        <div class="lesson-nav">
          <button class="nav-btn" id="prevLessonBtn">←</button>
          <span class="lesson-count" id="lessonCount">1 / 1</span>
          <button class="nav-btn" id="nextLessonBtn">→</button>
        </div>
      </div>

      <div id="grammarPane" class="hidden">
        <div class="grammar-list" id="grammarList"></div>
      </div>

      <div id="quizPane" class="hidden">
        <div class="quiz-card" id="quizCard"></div>
      </div>
    </div>

  </div>

  <footer>Lingo Trail — a little language practice, every day</footer>

  let currentLang = null;

  const lessonTranslation = document.getElementById("lessonTranslation");
  const lessonCount       = document.getElementById("lessonCount");
  const prevLessonBtn      = document.getElementById("prevLessonBtn");
  const nextLessonBtn      = document.getElementById("nextLessonBtn");
  const speakBtn            = document.getElementById("speakBtn");

  const quizCard               = document.getElementById("quizCard");

  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  }
  let progress = loadProgress();

  function renderLangGrid(){
    langGrid.innerHTML = Object.entries(LANGUAGES).map(([key, lang]) => `
      <div class="lang-card" data-key="${key}">
        <div class="lang-flag">${lang.flag}</div>
        <div class="lang-name">${lang.name}</div>
        <div class="lang-native">${lang.native}</div>
      </div>
    `).join("");

    langGrid.querySelectorAll(".lang-card").forEach(card => {
      card.addEventListener("click", () => openMotivation(card.dataset.key));
    });
  }

  function renderMotivationOptions(){
    motOptions.innerHTML = MOTIVATIONS.map(m => `
      <button class="motivation-opt" data-key="${m.key}">
        <span class="emoji">${m.emoji}</span>
        <span>${m.label}</span>
      </button>
    `).join("");

    motOptions.querySelectorAll(".motivation-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosen = MOTIVATIONS.find(m => m.key === btn.dataset.key);
        motResponseText.textContent = chosen.response;
        motResponse.classList.add("show");
      });
    });
  }

  function openMotivation(key){
    currentLang = key;
    const lang = LANGUAGES[key];
    motFlag.textContent = lang.flag;
    motTitle.textContent = `Why do you want to learn ${lang.name}?`;
    motResponse.classList.remove("show");
    pickerView.classList.add("hidden");
    motivationView.classList.remove("hidden");
    courseView.classList.add("hidden");
  }

  function openCourse(){
    lessonIndex = 0;
    currentTab = "vocabulary";
    motivationView.classList.add("hidden");
    courseView.classList.remove("hidden");
    setActiveTab("vocabulary");
    updateProgress();
  }

  function updateProgress(){
    const seen = (progress[currentLang] && progress[currentLang].seen) || {};
    const total = LANGUAGES[currentLang].vocabulary.length + LANGUAGES[currentLang].phrases.length;
    const seenCount = Object.keys(seen).length;
    const pct = total ? Math.round((seenCount / total) * 100) : 0;
    progressFill.style.width = pct + "%";
    progressLabel.textContent = pct + "%";
  }

  function markSeen(category, index){
    if(!progress[currentLang]) progress[currentLang] = { seen: {} };
    progress[currentLang].seen[category + "-" + index] = true;
    saveProgress(progress);
    updateProgress();
  }

  function setActiveTab(tab){
    currentTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === tab);
    });

    lessonPane.classList.add("hidden");
    grammarPane.classList.add("hidden");
    quizPane.classList.add("hidden");

    if(tab === "vocabulary" || tab === "phrases"){
      lessonIndex = 0;
      lessonPane.classList.remove("hidden");
      renderLesson();
    } else if(tab === "grammar"){
      grammarPane.classList.remove("hidden");
      renderGrammar();
    } else if(tab === "quiz"){
      quizPane.classList.remove("hidden");
      startQuiz();
    }
  }

  function renderLesson(){
    const list = LANGUAGES[currentLang][currentTab];
    const item = list[lessonIndex];
    lessonCategory.textContent = currentTab.toUpperCase();
    lessonWord.textContent = item.word;
    lessonPron.textContent = "/ " + item.pron + " /";
    lessonTranslation.textContent = item.translation;
    lessonCount.textContent = (lessonIndex + 1) + " / " + list.length;
    prevLessonBtn.disabled = lessonIndex === 0;
    nextLessonBtn.disabled = lessonIndex === list.length - 1;
    markSeen(currentTab, lessonIndex);
  }

  function renderGrammar(){
    const tips = LANGUAGES[currentLang].grammar;
    grammarList.innerHTML = tips.map(t => `
      <div class="grammar-item">
        <div class="grammar-title">${t.title}</div>
        <div class="grammar-text">${t.text}</div>
      </div>
    `).join("");
  }

  function buildQuizPool(){
    const lang = LANGUAGES[currentLang];
    const all = [...lang.vocabulary, ...lang.phrases];
    const shuffled = [...all].sort(() => Math.random() - 0.5).slice(0, 6);
    return shuffled.map(correct => {
      const wrongPool = all.filter(x => x.translation !== correct.translation);
      const wrongs = [...wrongPool].sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [...wrongs, correct].sort(() => Math.random() - 0.5);
      return { word: correct.word, answer: correct.translation, options: options.map(o => o.translation) };
    });
  }

  function startQuiz(){
    quizPool = buildQuizPool();
    quizIndex = 0;
    quizScore = 0;
    renderQuizQuestion();
  }

  function renderQuizQuestion(){
    quizAnswered = false;
    if(quizIndex >= quizPool.length){
      quizCard.innerHTML = `
        <div class="quiz-done">
          <h3>Nice work!</h3>
          <p>You scored ${quizScore} out of ${quizPool.length}</p>
          <button class="retry-btn" id="retryBtn">Try Again</button>
        </div>`;
      document.getElementById("retryBtn").addEventListener("click", startQuiz);
      return;
    }

    const q = quizPool[quizIndex];
    quizCard.innerHTML = `
      <div class="quiz-question">What does "${q.word}" mean?</div>
      <div class="quiz-options">
        ${q.options.map(opt => `<button class="quiz-opt" data-opt="${opt}">${opt}</button>`).join("")}
      </div>
      <div class="quiz-footer">
        <span class="quiz-score">Score: ${quizScore} / ${quizPool.length} &middot; Q${quizIndex + 1}/${quizPool.length}</span>
        <button class="next-quiz-btn" id="nextQuizBtn">Next →</button>
      </div>
    `;

    quizCard.querySelectorAll(".quiz-opt").forEach(btn => {
      btn.addEventListener("click", () => handleQuizAnswer(btn, q.answer));
    });
    document.getElementById("nextQuizBtn").addEventListener("click", () => {
      quizIndex++;
      renderQuizQuestion();
    });
  }

  function handleQuizAnswer(btn, correctAnswer){
    if(quizAnswered) return;
    quizAnswered = true;
    const chosen = btn.dataset.opt;
    const allOpts = quizCard.querySelectorAll(".quiz-opt");
    allOpts.forEach(o => {
      if(o.dataset.opt === correctAnswer) o.classList.add("correct");
      else if(o === btn) o.classList.add("wrong");
    });
    if(chosen === correctAnswer) quizScore++;
    document.getElementById("nextQuizBtn").classList.add("show");
  }

  function speak(){
    const list = LANGUAGES[currentLang][currentTab];
    const item = list[lessonIndex];
    if(!("speechSynthesis" in window)) return;
    const utter = new SpeechSynthesisUtterance(item.word);
    utter.lang = LANGUAGES[currentLang].speechLang;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
  });

  prevLessonBtn.addEventListener("click", () => {
    if(lessonIndex > 0){ lessonIndex--; renderLesson(); }
  });
  nextLessonBtn.addEventListener("click", () => {
    const list = LANGUAGES[currentLang][currentTab];
    if(lessonIndex < list.length - 1){ lessonIndex++; renderLesson(); }
  });
  speakBtn.addEventListener("click", speak);

  startLearningBtn.addEventListener("click", openCourse);

  motBackLink.addEventListener("click", () => {
    motivationView.classList.add("hidden");
    pickerView.classList.remove("hidden");
  });

  backBtn.addEventListener("click", () => {
    courseView.classList.add("hidden");
    pickerView.classList.remove("hidden");
  });

  renderLangGrid();
  renderMotivationOptions();
})();
</script>
</body>
</html>
